<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stop Flock in Woodstock Signers</title>
  <meta name="description" content="City-level map of Stop Flock in Woodstock petition signers.">
  <meta property="og:title" content="Stop Flock in Woodstock Signers">
  <meta property="og:description" content="City-level map of Stop Flock in Woodstock petition signers.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stopflockinwoodstock.github.io/signers-map/">
  <meta property="og:image" content="https://stopflockinwoodstock.github.io/signers-map/social-preview.png">
  <meta property="og:image:width" content="2772">
  <meta property="og:image:height" content="1610">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Stop Flock in Woodstock Signers">
  <meta name="twitter:description" content="City-level map of Stop Flock in Woodstock petition signers.">
  <meta name="twitter:image" content="https://stopflockinwoodstock.github.io/signers-map/social-preview.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #5b6670;
      --line: #d9e0e6;
      --panel: #ffffff;
      --surface: #f6f8f9;
      --accent: #ff174d;
      --accent-strong: #d50032;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--surface);
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
      background: #dbe3e8;
    }

    /* Critical Leaflet layout rules. Keeping these local prevents broken tile
       layout if the CDN stylesheet is delayed or blocked. */
    .leaflet-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      outline-style: none;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      width: 256px;
      height: 256px;
      max-width: none;
      max-height: none;
      border: 0;
      padding: 0;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-control-container .leaflet-control {
      margin: 10px;
    }

    .panel {
      height: 100vh;
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subhead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }

    .stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 28px;
      line-height: 1;
      font-weight: 750;
    }

    .list {
      overflow: auto;
      padding: 14px 0 20px;
    }

    .source-note {
      padding: 12px 24px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .source-note a {
      color: inherit;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 54px;
      gap: 14px;
      align-items: center;
      padding: 9px 24px;
      border-left: 4px solid transparent;
    }

    .row:hover {
      background: #f4f7f9;
      border-left-color: var(--accent);
    }

    .place {
      min-width: 0;
    }

    .city {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .county {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .bar-wrap {
      margin-top: 7px;
      height: 5px;
      background: #e8edf1;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border-radius: inherit;
    }

    .count {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 750;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(58vh, 1fr) auto;
      }

      #map {
        height: 58vh;
      }

      .panel {
        height: 42vh;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .list {
        max-height: 38vh;
      }

    }
  </style>
</head>
<body>
  <main class="app">
    <section id="map" aria-label="Heat map of signer volume by city"></section>
    <aside class="panel" aria-label="Signer counts by location">
      <header class="header">
        <h1>Stop Flock in Woodstock Signers</h1>
        <p class="subhead">Last updated August 17, 2026 CT</p>
      </header>
      <section class="stats" aria-label="Summary statistics">
        <div class="stat">
          <div class="stat-label">Signers mapped</div>
          <div class="stat-value" id="totalSigners">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Locations</div>
          <div class="stat-value" id="totalLocations">0</div>
        </div>
      </section>
      <section class="list" id="locationList" aria-label="Locations ranked by signer count"></section>
      <footer class="source-note">
        City coordinate data from <a href="https://github.com/dr5hn/countries-states-cities-database">Countries States Cities Database</a>, ODbL v1.0.
      </footer>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const locations = __LOCATIONS_JSON__;

    const totalSigners = locations.reduce((sum, location) => sum + location.count, 0);
    const maxCount = Math.max(...locations.map((location) => location.count));
    document.getElementById("totalSigners").textContent = totalSigners.toLocaleString();
    document.getElementById("totalLocations").textContent = locations.length.toLocaleString();

    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true
    });

    L.control.zoom({ position: "topright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const mchenryLocations = locations.filter((location) => location.county.toLowerCase() === "mchenry");
    const bounds = L.latLngBounds(mchenryLocations.map((location) => [location.lat, location.lng]));
    map.fitBounds(bounds.pad(0.18));
    requestAnimationFrame(() => map.invalidateSize());

    function seededUnit(seed) {
      const x = Math.sin(seed * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    }

    function jitteredPoint(location, index) {
      const angle = seededUnit(index + location.lat * 1000) * Math.PI * 2;
      const spreadMeters = 1450 + Math.sqrt(location.count) * 360;
      const distanceSeed = (
        seededUnit(index + location.lng * 1000) +
        seededUnit(index * 1.37 + location.lat * 1000) +
        seededUnit(index * 2.11 + location.lng * 500)
      ) / 3;
      const distanceMeters = Math.pow(distanceSeed, 2.15) * spreadMeters;
      const northMeters = Math.sin(angle) * distanceMeters;
      const eastMeters = Math.cos(angle) * distanceMeters;
      const lat = location.lat + northMeters / 111320;
      const lng = location.lng + eastMeters / (111320 * Math.cos(location.lat * Math.PI / 180));
      return L.latLng(lat, lng);
    }

    const pointRenderer = L.canvas({ padding: 0.5 });
    const signerLayer = L.layerGroup().addTo(map);

    function drawSignerPoints() {
      let signerIndex = 0;
      for (const location of locations) {
        for (let i = 0; i < location.count; i += 1) {
          signerIndex += 1;
          const latLng = jitteredPoint(location, signerIndex);
          L.circleMarker(latLng, {
            radius: 10,
            color: "#ff174d",
            weight: 1.5,
            opacity: 0.8,
            fillColor: "#ff174d",
            fillOpacity: 0.1,
            interactive: false,
            renderer: pointRenderer
          }).addTo(signerLayer);
        }
      }
    }

    function drawTooltips() {
      for (const location of locations) {
        L.circleMarker([location.lat, location.lng], {
          radius: 10,
          stroke: false,
          fillOpacity: 0,
          keyboard: false
        })
          .bindTooltip(`${location.city}, ${location.state}: ${location.count.toLocaleString()} signers`, {
            direction: "top",
            sticky: true
          })
          .addTo(map);
      }
    }

    function drawLocationList() {
      const list = document.getElementById("locationList");
      list.innerHTML = "";
      for (const location of locations) {
        const row = document.createElement("article");
        row.className = "row";
        const place = location.county ? `${location.county} County, ${location.state}` : location.state;
        row.innerHTML = `
          <div class="place">
            <div class="city">${location.city}</div>
            <div class="county">${place} - ${location.count.toLocaleString()} of ${totalSigners.toLocaleString()} signers</div>
            <div class="bar-wrap" aria-hidden="true">
              <div class="bar" style="width: ${(location.count / maxCount) * 100}%"></div>
            </div>
          </div>
          <div class="count">${location.count.toLocaleString()}</div>
        `;
        list.appendChild(row);
      }
    }

    drawSignerPoints();
    drawTooltips();
    drawLocationList();
  </script>
</body>
</html>
