  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #5b6670;
      --line: #d9e0e6;
      --panel: #ffffff;
      --surface: #f6f8f9;
      --accent: #ff174d;
      --accent-strong: #d50032;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--surface);
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
      background: #dbe3e8;
    }

    /* Critical Leaflet layout rules. Keeping these local prevents broken tile
       layout if the CDN stylesheet is delayed or blocked. */
    .leaflet-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      outline-style: none;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      width: 256px;
      height: 256px;
      max-width: none;
      max-height: none;
      border: 0;
      padding: 0;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-control-container .leaflet-control {
      margin: 10px;
    }

    .panel {
      height: 100vh;
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 20px 10px;
      border-bottom: 1px solid var(--line);
    }

    .header-top {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .header-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subhead {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .header-links {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      width: 100%;
      gap: 6px;
      padding-top: 0;
    }

    .header-link {
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
      text-decoration: none;
    }

    .header-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      border-radius: 4px;
      background: var(--accent-strong);
      color: #ffffff;
      font-size: 12px;
      font-weight: 750;
      line-height: 1;
      text-decoration: none;
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .header-cta:hover {
      background: var(--ink);
    }

    .header-cta-secondary {
      border: 1px solid var(--accent-strong);
      background: var(--panel);
      color: var(--accent-strong);
    }

    .header-cta-secondary:hover {
      background: var(--accent-strong);
      color: #ffffff;
    }

    .header-link:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .header-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }

    .stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 28px;
      line-height: 1;
      font-weight: 750;
    }

    .list {
      overflow: auto;
      padding: 14px 0 20px;
    }

    .source-note {
      padding: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 8px;
      line-height: 1.35;
    }

    .source-note a {
      color: inherit;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 54px;
      gap: 14px;
      align-items: center;
      padding: 9px 24px;
      border-left: 4px solid transparent;
    }

    .row:hover {
      background: #f4f7f9;
      border-left-color: var(--accent);
    }

    .place {
      min-width: 0;
    }

    .city {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .county {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .bar-wrap {
      margin-top: 7px;
      height: 5px;
      background: #e8edf1;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border-radius: inherit;
    }

    .count {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 750;
    }

    @media (max-width: 860px) {
      .header {
        padding: 12px 16px 10px;
      }

      .header-top {
        gap: 8px;
      }

      .header-links {
        gap: 6px;
        padding-top: 0;
      }

      .header-cta {
        padding-inline: 8px;
        font-size: 11px;
        text-align: center;
        white-space: normal;
      }

      .header-link {
        font-size: 11px;
      }

      .header-note {
        font-size: 10px;
      }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(58vh, 1fr) auto;
      }

      #map {
        height: 58vh;
      }

      .panel {
        height: 42vh;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .list {
        max-height: 38vh;
      }

    }
  </style>
</head>
<body>
  <main class="app">
    <section id="map" aria-label="Heat map of signer volume by city"></section>
    <aside class="panel" aria-label="Signer counts by location">
      <header class="header">
        <div class="header-top">
          <div class="header-copy">
            <p class="eyebrow">Stop Flock in Woodstock</p>
            <h1>Signers</h1>
          </div>
          <div class="header-links" aria-label="Campaign links">
            <a class="header-cta" href="https://www.change.org/p/we-want-flock-safety-out-of-woodstock-il">Sign the petition</a>
            <a class="header-cta header-cta-secondary" href="https://stopflockinwoodstock.org/">Get Updates</a>
            <a class="header-cta header-cta-secondary" href="https://www.facebook.com/groups/3220098864829509/">Join FB Group</a>
          </div>
        </div>
        <p class="header-note">Signer locations are randomized to protect privacy.</p>
        <p class="header-note">Updated August 19, 2026 at 11:14 PM CT</p>
      </header>
      <section class="stats" aria-label="Summary statistics">
        <div class="stat">
          <div class="stat-label">Signatures</div>
          <div class="stat-value" id="totalSigners">0</div>
          <div class="stat-label">(paper + online)</div>
        </div>
        <div class="stat">
          <div class="stat-label">Locations</div>
          <div class="stat-value" id="totalLocations">0</div>
        </div>
      </section>
      <section class="list" id="locationList" aria-label="Locations ranked by signer count"></section>
      <footer class="source-note">
        Coordinate data from <a href="https://github.com/dr5hn/countries-states-cities-database">Countries States Cities Database</a>, ODbL v1.0.
      </footer>
    </aside>
  </main>

    const totalSignatures = 2016;
    const maxCount = Math.max(...locations.map((location) => location.count));
    document.getElementById("totalSigners").textContent = "0";
    document.getElementById("totalLocations").textContent = locations.length.toLocaleString();

    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true
    });
    const signerMarkers = [];

    L.control.zoom({ position: "topright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const mchenryLocations = locations.filter((location) => location.county.toLowerCase() === "mchenry");
    const bounds = L.latLngBounds(mchenryLocations.map((location) => [location.lat, location.lng]));
    map.fitBounds(bounds.pad(0.18));
    requestAnimationFrame(() => map.invalidateSize());

    function seededUnit(seed) {
      const x = Math.sin(seed * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    }

    function jitteredPoint(location, index) {
      const angle = seededUnit(index + location.lat * 1000) * Math.PI * 2;
      const spreadMeters = 1450 + Math.sqrt(location.count) * 360;
      const distanceSeed = (
        seededUnit(index + location.lng * 1000) +
        seededUnit(index * 1.37 + location.lat * 1000) +
        seededUnit(index * 2.11 + location.lng * 500)
      ) / 3;
      const distanceMeters = Math.pow(distanceSeed, 2.15) * spreadMeters;
      const northMeters = Math.sin(angle) * distanceMeters;
      const eastMeters = Math.cos(angle) * distanceMeters;
      const lat = location.lat + northMeters / 111320;
      const lng = location.lng + eastMeters / (111320 * Math.cos(location.lat * Math.PI / 180));
      return L.latLng(lat, lng);
    }

    const TextureCanvas = L.Canvas.extend({
      _fillStroke(ctx, layer) {
        ctx.save();

        ctx.globalCompositeOperation = "lighter";

        L.Canvas.prototype._fillStroke.call(this, ctx, layer);

        ctx.restore();
      }
    });

    const pointRenderer = new TextureCanvas({ padding: 0.5 });
    const signerLayer = L.layerGroup().addTo(map);

    function signerRadiusForZoom() {
      const zoom = map.getZoom();

      if (zoom >= 19) return 250;
      if (zoom >= 18) return 150;
      if (zoom >= 17) return 90;
      if (zoom >= 16) return 55;
      if (zoom >= 15) return 32;
      if (zoom >= 14) return 18;

      return 10;
    }

    map.on("zoomend", () => {
      const radius = signerRadiusForZoom();

      signerLayer.eachLayer((marker) => {
        marker.setRadius(radius);
      });
    });

    function startAmbientSignerMotion() {
      function pulseRandomSigner() {
        const marker =
          signerMarkers[Math.floor(Math.random() * signerMarkers.length)];

        const baseRadius = signerRadiusForZoom();
        const start = performance.now();
        const duration = 700;

        function pulse(now) {
          const progress = Math.min(1, (now - start) / duration);

          // 0 → 1 → 0
          const wave = Math.sin(progress * Math.PI) ** 2;

          marker.setRadius(baseRadius * (1 + 0.1 * wave));

          marker.setStyle({
            fillOpacity: 0.1 + 0.15 * wave,
            opacity: 0.8 + 0.2 * wave
          });

          if (progress < 1) {
            requestAnimationFrame(pulse);
          } else {
            marker.setRadius(signerRadiusForZoom());

            marker.setStyle({
              fillOpacity: 0.1,
              opacity: 0.8
            });
          }
        }

        requestAnimationFrame(pulse);

        // Random interval prevents a detectable rhythm.
        setTimeout(pulseRandomSigner, 50 + Math.random() * 100);
      }

      pulseRandomSigner();
    }

    function drawSignerPoints() {
      let signerIndex = 0;
      const animations = [];

      const START_DELAY = 500;
      const END_DELAY = 8000;
      const DURATION = 400;

      const START_RADIUS = 24;
      const FINAL_RADIUS = 12;

      // Respect reduced-motion accessibility settings.
      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      const animationStart = performance.now();

      animateSignatureTotal(animationStart, reduceMotion, START_DELAY, END_DELAY);

      for (const location of locations) {
        for (let i = 0; i < location.count; i += 1) {
          signerIndex += 1;

          const latLng = jitteredPoint(location, signerIndex);

          const marker = L.circleMarker(latLng, {
            radius: reduceMotion ? FINAL_RADIUS : START_RADIUS,
            color: "#ff174d",
            weight: 1.5,
            opacity: reduceMotion ? 0.8 : 0,
            fillColor: "hsl(346 100% 95%)",
            fillOpacity: reduceMotion ? 0.1 : 0,
            interactive: false,
            renderer: pointRenderer
          }).addTo(signerLayer);
          signerMarkers.push(marker);

          if (!reduceMotion) {
            // Cubic distribution:
            // relatively few early dots, rapidly increasing toward 8 sec.
            const randomPosition = Math.pow(Math.random(), 1 / 3);

            const delay =
              START_DELAY +
              randomPosition * (END_DELAY - START_DELAY);

            animations.push({
              marker,
              start: animationStart + delay
            });
          }
        }
      }

      if (!reduceMotion) {
        animateSignerPoints(animations, DURATION, START_RADIUS, FINAL_RADIUS);
        setTimeout(
          startAmbientSignerMotion,
          END_DELAY + DURATION
        );
      }
    }

    function animateSignatureTotal(animationStart, reduceMotion, startDelay, endDelay) {
      const totalElement = document.getElementById("totalSigners");
      if (reduceMotion) {
        totalElement.textContent = totalSignatures.toLocaleString();
        return;
      }

      const start = animationStart + startDelay;
      const duration = endDelay - startDelay;

      function frame(now) {
        const progress = Math.min(1, Math.max(0, (now - start) / duration));
        const plottedProgress = Math.pow(progress, 3);
        totalElement.textContent = Math.round(totalSignatures * plottedProgress).toLocaleString();

        if (progress < 1) requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    function animateSignerPoints(
      animations,
      duration,
      startRadius,
      finalRadius
    ) {
      // Sorting means we don't repeatedly inspect points whose
      // animation hasn't started yet.
      animations.sort((a, b) => a.start - b.start);

      let nextAnimation = 0;
      const active = [];

      function frame(now) {
        // Move newly-started dots into the active animation list.
        while (
          nextAnimation < animations.length &&
          animations[nextAnimation].start <= now
        ) {
          active.push(animations[nextAnimation]);
          nextAnimation += 1;
        }

        for (let i = active.length - 1; i >= 0; i -= 1) {
          const animation = active[i];

          const progress = Math.min(
            1,
            (now - animation.start) / duration
          );

          // Ease-out cubic:
          // rapid initial movement, gentle landing at final size.
          const eased =
            1 - Math.pow(1 - progress, 3);

          const radius =
            startRadius -
            (startRadius - finalRadius) * eased;

          // No fade from invisible — it appears immediately.
          const fadeProgress = 1;

          animation.marker.setRadius(radius);

          // Very pale pink -> final red
          const fillColor = `hsl(346 100% ${95 - (40 * eased)}%)`;

          animation.marker.setStyle({
            color: "#ff174d",
            fillColor: "hsl(346 100% 60%)",
            opacity: 1,
            fillOpacity: 0.9 - (0.8 * eased)
          });

          if (progress >= 1) {
            animation.marker.setRadius(finalRadius);

            animation.marker.setStyle({
              opacity: 0.8,
              fillOpacity: 0.1
            });

            active.splice(i, 1);
          }
        }

        if (
          nextAnimation < animations.length ||
          active.length > 0
        ) {
          requestAnimationFrame(frame);
        }
      }

      requestAnimationFrame(frame);
    }

    function drawTooltips() {
      for (const location of locations) {
        L.circleMarker([location.lat, location.lng], {
          radius: 10,
          stroke: false,
          fillOpacity: 0,
          keyboard: false
        })
          .bindTooltip(`${location.city}, ${location.state}: ${location.count.toLocaleString()} signers`, {
            direction: "top",
            sticky: true
          })
          .addTo(map);
      }
    }

    function drawLocationList() {
      const list = document.getElementById("locationList");
      list.innerHTML = "";
      for (const location of locations) {
        const row = document.createElement("article");
        row.className = "row";
        const place = location.county ? `${location.county} County, ${location.state}` : location.state;
        row.innerHTML = `
          <div class="place">
            <div class="city">${location.city}</div>
            <div class="county">${place} - ${location.count.toLocaleString()} of ${totalSignatures.toLocaleString()} signatures</div>
            <div class="bar-wrap" aria-hidden="true">
              <div class="bar" style="width: ${(location.count / maxCount) * 100}%"></div>
            </div>
          </div>
          <div class="count">${location.count.toLocaleString()}</div>
        `;
        list.appendChild(row);
      }
    }

    drawSignerPoints();
    drawTooltips();
    drawLocationList();
  </script>
